name: CI

# Economical by design: one job, PHP 8.2 only, skipped for documentation-only changes,
# superseded runs are cancelled. Tests that need network or secrets (group "integration")
# run on the project server, not here.
on:
  push:
    branches: [master]
    paths-ignore: ['**.md']
  pull_request:
    branches: [master]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      php:
        description: PHP version
        default: '8.2'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php || '8.2' }}
          coverage: none
          tools: composer:v2

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Analyzer cache
        uses: actions/cache@v4
        with:
          path: var/cache
          key: analyzers-${{ runner.os }}-${{ github.sha }}
          restore-keys: analyzers-${{ runner.os }}-

      # the pinned binary is not needed by the checks: a fake one stands in
      - run: composer install --no-interaction --no-progress --prefer-dist
        env:
          GEMINI_API_SKIP_FETCH: "1"

      - run: composer check
